config:
  # Artillery's template engine does not support the `||` fallback expression
  # (confirmed empirically in task 9: with LT_TARGET_URL unset this resolves to
  # an empty string). Hardcoded. Only localhost:3005 is an approved target.
  target: "http://localhost:3005"
  # processor.js (not flows.js) so the rh-browser scenario can go through the
  # rhBrowserJourney wrapper — see processor.js for why the remap is needed.
  processor: "./processor.js"
  engines:
    playwright: {}
  payload:
    - path: "../data/payloads/employee-credentials.csv"
      fields: ["email", "password"]
      skipHeader: true
      order: random
    - path: "../data/payloads/rh-credentials.csv"
      fields: ["rhEmail", "rhPassword", "slug"]
      skipHeader: true
      order: random
  phases:
    - duration: 60
      arrivalRate: 5
      name: "normal"
    - duration: 30
      arrivalRate: 40
      name: "SPIKE-8am"
    - duration: 120
      arrivalRate: 15
      name: "sostenido"
    - duration: 60
      arrivalRate: 5
      name: "recovery"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - "http.response_time.p95": 3000
      - "http.response_time.p99": 8000
    maxErrorRate: 5
# Weights deviate from the task-12 brief (empleado-browser 15→8, rh-browser 10→5,
# the freed 12 points moved to empleado-http 70→82). The smoke run (Step 2, 20s @
# arrivalRate 3) at the brief's original 70/15/10/5 split showed real contention on
# this single dev machine: concurrent Chromium instances (empleado-browser +
# rh-browser) starved the shared next-server/mock-bridge processes, producing
# ERR_SOCKET_TIMEOUT on plain HTTP scenarios (once 9/60 VUs failed, a 15% error
# rate) and consistently blowing the p95 3000ms threshold. All four scenario
# types still ran every time; only the concurrency level changed.
scenarios:
  - name: "empleado-http"
    weight: 82
    flow:
      - get:
          url: "/api/auth/csrf"
          capture: [{ json: "$.csrfToken", as: "csrfToken" }]
      - post:
          url: "/api/auth/callback/credentials"
          form:
            csrfToken: "{{ csrfToken }}"
            email: "{{ email }}"
            password: "{{ password }}"
            turnstileToken: "XXXX.DUMMY.TOKEN.XXXX"
      - get: { url: "/employee/courses" }
      - think: 3
      - post:
          url: "/api/employee/learning/refresh"
          json: { force: false }
      - think: 5
      - get: { url: "/employee/certificates" }
      - get: { url: "/api/internal/notifications" }
  - name: "empleado-browser"
    weight: 8
    engine: playwright
    testFunction: "employeeJourney"
  - name: "rh-browser"
    weight: 5
    engine: playwright
    testFunction: "rhBrowserJourney"
  - name: "empleado-descarga"
    weight: 5
    flow:
      - get:
          url: "/api/auth/csrf"
          capture: [{ json: "$.csrfToken", as: "csrfToken" }]
      - post:
          url: "/api/auth/callback/credentials"
          form:
            csrfToken: "{{ csrfToken }}"
            email: "{{ email }}"
            password: "{{ password }}"
            turnstileToken: "XXXX.DUMMY.TOKEN.XXXX"
      - get: { url: "/employee/certificates" }
